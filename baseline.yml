---
- name: Baseline Configuration
  hosts: all
  become: true
  roles:
    - common
    - fail2ban

  tasks:
    - name: Debug vault resolve
      ansible.builtin.debug:
        msg: "Vault resolved: {{ fake_api_token }}"

- name: Docker Configuration
  hosts: debian
  become: true
  roles:
    - docker

- name: Update notifier for Ubuntu
  hosts: ubuntu
  become: true
  tasks:
    - name: Install update-notifier-common package
      ansible.builtin.package:
        name: update-notifier-common
        state: present
